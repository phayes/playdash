[package]
name = "playdash"
version = "0.1.0"
authors = ["Patrick Hayes <patrick.d.hayes@gmail.com>"]
description = "Parse MPEG-DASH manifests and set them up for progressive streaming playback"
license = "MIT"
edition = "2024"
repository = "https://github.com/phayes/playdash"
homepage = "https://github.com/phayes/playdash"
documentation = "https://docs.rs/playdash"
readme = "README.md"
keywords = ["dash", "mpeg-dash", "streaming", "audio"]
categories = ["multimedia::audio", "parser-implementations"]

[dependencies]
aes = { version = "0.9", optional = true }
base64 = "0.23"
ctr = { version = "0.10", optional = true }
# dash-mpd-core 0.1.0 fails to build without its `log` feature (it imports `tracing`
# unconditionally), so it stays on regardless of our own `log` feature.
dash-mpd-core = { version = "0.1", default-features = false, features = ["log"] }
log = { version = "^0.4", optional = true }
rodio = { version = "0.22", optional = true, default-features = false, features = [
    "symphonia-isomp4",
] }
thiserror = "^2.0"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
url = "2.5"

[features]
default = ["log"]
rodio = ["dep:rodio"]
log = ["dep:log"]
encryption = ["dep:aes", "dep:ctr"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
crossterm = "0.29"
env_logger = "0.11"
rodio = { version = "0.22", default-features = false, features = [
    "symphonia-aac",
    "symphonia-flac",
    "symphonia-isomp4",
    "playback",
] }

[[example]]
name = "player"
required-features = ["rodio"]
