[package]
name = "playdash"
version = "0.1.0"
authors = ["Patrick Hayes <patrick.d.hayes@gmail.com>"]
description = "Parse MPEG-DASH manifests and set them up for progressive streaming playback"
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/phayes/playdash"
homepage = "https://github.com/phayes/playdash"
documentation = "https://docs.rs/playdash"
readme = "README.md"
keywords = ["dash", "mpeg-dash", "streaming", "rodio"]
categories = ["multimedia::audio"]

[dependencies]
aes = { version = "0.9", optional = true }
base64 = "0.23"
ctr = { version = "0.10", optional = true }
log = { version = "^0.4", optional = true }
rodio = { version = "0.22", optional = true, default-features = false, features = [
    "symphonia-isomp4",
] }
thiserror = "^2.0"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
url = "2.5"

# Vendored dash-mpd-core (src/vendor/dash_mpd_core). It also uses `thiserror`, `url` and,
# with our `log` feature, `log` from above.
chrono = { version = "0.4.45", features = ["serde"] }
iso8601 = "0.6.5"
num-traits = "0.2.19"
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
serde_with = "3.23.0"

[features]
default = ["log"]
rodio = ["dep:rodio"]
log = ["dep:log"]
encryption = ["dep:aes", "dep:ctr"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
crossterm = "0.29"
env_logger = "0.11"
rodio = { version = "0.22", default-features = false, features = [
    "symphonia-aac",
    "symphonia-flac",
    "symphonia-isomp4",
    "playback",
] }

[[example]]
name = "player"
required-features = ["rodio"]
