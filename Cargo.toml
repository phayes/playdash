[package]
name = "playdash"
version = "0.2.0"
authors = ["Patrick Hayes <patrick.d.hayes@gmail.com>"]
description = "Parse MPEG-DASH manifests and set them up for progressive streaming playback"
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/phayes/playdash"
homepage = "https://github.com/phayes/playdash"
documentation = "https://docs.rs/playdash"
readme = "README.md"
keywords = ["dash", "mpeg-dash", "streaming", "rodio"]
categories = ["multimedia::audio"]

[dependencies]
aes = { version = "0.9", optional = true }
base64 = "0.23"
bytes = { version = "1.10", optional = true }
ctr = { version = "0.10", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
log = { version = "^0.4", optional = true }
# rustls, like ureq's, for the client the async API makes when the caller brings none.
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls"] }
rodio = { version = "0.22", optional = true, default-features = false, features = [
    "symphonia-isomp4",
] }
thiserror = "^2.0"
# The async stream's download tasks, and its `AsyncRead` and `AsyncSeek`.
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "sync"] }
ureq = { version = "3.1", optional = true, default-features = false, features = ["rustls"] }
url = "2.5"
serde = { version = "1", features = ["derive"] }

# Vendored dash-mpd-core (src/vendor/dash_mpd_core). It also uses `thiserror`, `url` and,
# with our `log` feature, `log` from above.
chrono = { version = "0.4.45", features = ["serde"] }
iso8601 = "0.6.5"
num-traits = "0.2.19"
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
serde_path_to_error = "0.1.20"
serde_with = "3.23.0"

[features]
default = ["sync"]
# The blocking API: `FragmentStream`, `FragmentCache` and `Transport`, fetching through ureq.
sync = ["dep:ureq", "dep:bytes"]
# The async API in `playdash::nonblocking`: `DashManifest`, `FragmentStream`, `FragmentCache`
# and `Transport`, fetching through reqwest on tokio.
async = ["dep:reqwest", "dep:futures-util", "dep:bytes", "dep:tokio"]
rodio = ["sync", "dep:rodio"]
log = ["dep:log"]
encryption = ["dep:aes", "dep:ctr"]
# Test only: runs tests/conformance.rs against GPAC's conformance server. Adds nothing to the
# library.
conformance = ["sync"]
# Test only: decodes tests/decoder.rs's decoder-ready packets with the `ffmpeg` on PATH.
# Adds nothing to the library.
ffmpeg-tests = ["sync"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
crossterm = "0.29"
env_logger = "0.11"
# Without its default `download_ffmpeg`, it runs the `ffmpeg` on PATH.
ffmpeg-sidecar = { version = "2.6", default-features = false }
minifb = "0.29"
rodio = { version = "0.22", default-features = false, features = [
    "symphonia-aac",
    "symphonia-flac",
    "symphonia-isomp4",
    "playback",
] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
ureq = { version = "3.1", default-features = false, features = ["rustls"] }

[[example]]
name = "list_representations"
required-features = ["sync"]

[[example]]
name = "list_packets"
required-features = ["sync"]

[[example]]
name = "list_tracks"
required-features = ["sync"]

[[example]]
name = "save_flac"
required-features = ["sync"]

[[example]]
name = "audio_player"
required-features = ["rodio"]

[[example]]
name = "video_player"
required-features = ["rodio"]
